<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Gemini Bridge</title>
  <style>
    body { width: 280px; padding: 14px; margin: 0; font-family: sans-serif; background: #0f172a; color: #f8fafc; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-badge { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .status-badge.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-badge.offline { background: #ef4444; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .desc { font-size: 11px; color: #94a3b8; margin: 12px 0; line-height: 1.5; }
    .donate { display: block; text-align: center; padding: 7px; background: #1e293b; color: #fbbf24; border-radius: 6px; font-size: 11.5px; text-decoration: none; font-weight: bold; }
    .donate:hover { background: #334155; }
  </style>
</head>
<body>
  <h3>⚡ Gemini Desktop Bridge</h3>
  <div class="row">
    <span>本地中继服务</span>
    <span><span id="daemon-badge" class="status-badge"></span> <span id="daemon-status">检测中...</span></span>
  </div>
  <div class="row">
    <span>主力执行 Agent</span>
    <span style="color: #38bdf8;">Antigravity / Local Shell</span>
  </div>
  <div class="desc">
    在 gemini.google.com 聊天，每条回答下方均有一键直达桌面的执行按钮。
  </div>
  <a href="https://github.com/zihew806-hue/gemini-desktop-bridge#support-the-author" target="_blank" class="donate">☕ 觉得好用？支持作者一杯咖啡</a>
  <script src="popup.js"></script>
</body>
</html>
